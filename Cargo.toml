[package]
name = "swdir"
version = "0.11.2"
edition = "2024"

description = "Swiftly traverse and scan directories. Sway 🪭, swing 🎷 or swim 🪼 in directories."
authors = ["nabbisen <nabbisen@scqr.net>"]
license = "Apache-2.0"

categories = ["filesystem"]
keywords = ["filesystem", "walk", "iterator", "concurrency", "filter"]
repository = "https://github.com/nabbisen/swdir"
readme = "README.md"

[features]
# The basic filter system is part of the crate's standard surface.
# Turn it off only if you genuinely want a bare walker with no filtering
# (rare — most callers should leave the default on).
default = ["filter"]
filter = []

[profile.release]     # shrink executable size
opt-level = "z"
lto = true
# panic = "abort"
strip = true
codegen-units = 1

[profile.dev]         # to improve productivity
opt-level = 1         # slightly optimize
lto = false           # disable link-time optimizations
incremental = false

[dependencies]
rayon = "1"
thiserror = "2"
